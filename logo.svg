<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <style>
        .logo-path {
            stroke: #38bdf8;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
    </style>
    <!-- Outer Circle -->
    <circle cx="50" cy="50" r="45" class="logo-path" />
    
    <!-- Left Column (S) -->
    <path d="M 36 42 A 9 9 0 0 0 18 44 C 18 50, 36 50, 36 56 A 9 9 0 0 1 18 58" class="logo-path" />
    
    <!-- Central Column (H) segments -->
    <!-- Top vertical lines -->
    <line x1="42" y1="5.7" x2="42" y2="34" class="logo-path" />
    <line x1="58" y1="5.7" x2="58" y2="34" class="logo-path" />
    
    <!-- H character itself -->
    <line x1="42" y1="38" x2="42" y2="62" class="logo-path" />
    <line x1="58" y1="38" x2="58" y2="62" class="logo-path" />
    <line x1="42" y1="50" x2="58" y2="50" class="logo-path" />
    
    <!-- Bottom vertical lines -->
    <line x1="42" y1="66" x2="42" y2="94.3" class="logo-path" />
    <line x1="58" y1="66" x2="58" y2="94.3" class="logo-path" />
    
    <!-- Right Column (U) -->
    <path d="M 64 38 V 53 A 9 9 0 0 0 82 53 V 38" class="logo-path" />
</svg>
